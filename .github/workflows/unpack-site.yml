name: Unpack FinancesPME site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish extracted site
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bundle2/part17.b64 ]; then
            echo "Clean bundle already unpacked."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat bundle2/part*.b64 > /tmp/financespme-site.b64
          base64 --decode /tmp/financespme-site.b64 > /tmp/financespme-site.zip
          unzip -t /tmp/financespme-site.zip
          unzip -oq /tmp/financespme-site.zip -d .

          rm -rf bundle bundle2

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Publish complete FinancesPME static site"
          git push origin HEAD:main

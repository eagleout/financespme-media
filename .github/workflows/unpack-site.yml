name: Unpack FinancesPME site

on:
  push:
    branches: [main]
    paths:
      - "bundle/**"
      - ".github/workflows/unpack-site.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild site archive
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part{01..17}.b64 > /tmp/financespme-site.b64
          base64 --decode /tmp/financespme-site.b64 > /tmp/financespme-site.zip
          unzip -t /tmp/financespme-site.zip
          unzip -oq /tmp/financespme-site.zip -d .
          rm -rf bundle

      - name: Commit extracted site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish complete FinancesPME static site"
          git push
